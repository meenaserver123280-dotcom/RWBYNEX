<div class="wallet-card">

</div>

<script>
function addLog(msg, type) {
    var log = document.getElementById('log');
    var div = document.createElement('div');
    div.className = type || '';
    div.textContent = '> ' + msg;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

function testShield() {
    var attr = document.documentElement.getAttribute('data-shield');
    var session = document.documentElement.getAttribute('data-session');
    
    if (attr === 'active') {
        addLog('✅ SHIELD ACTIVE! Session: ' + (session || 'N/A'), 'good');
        addLog('🛡️ F12, RC, Inspect, View-Source sab BLOCK', 'good');
        alert('✅ SHIELD ACTIVE!\n\nF12: Blocked\nRight-Click: Blocked\nCtrl+Shift+I: Blocked\nView Source: Blocked\nPrintScreen: Blocked\n\nHacker ki maa chud gayi! 💀');
    } else {
        addLog('❌ Shield not detected. data-shield="' + (attr || 'null') + '"', 'bad');
        alert('❌ Shield inactive.\nScript load nahi hui? URL check karo.');
    }
}

// Shield check
setTimeout(function() {
    var attr = document.documentElement.getAttribute('data-shield');
    if (attr === 'active') {
        addLog('✅ SHIELD ACTIVE — Fully Protected!', 'good');
    } else {
        addLog('❌ Shield NOT active. Retrying...', 'bad');
        setTimeout(function() {
            var attr2 = document.documentElement.getAttribute('data-shield');
            if (attr2 === 'active') {
                addLog('✅ Shield active (delayed)!', 'good');
            } else {
                addLog('❌ Shield failed to load. Check URL', 'bad');
            }
        }, 2000);
    }
}, 1000);

// Keyboard logger
document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || e.key === 'f12' || e.keyCode === 123) {
        addLog('⌨️ F12 pressed → ⛔ BLOCKED', 'good');
    }
    if (e.ctrlKey && e.shiftKey && e.key === 'I') {
        addLog('⌨️ Ctrl+Shift+I → ⛔ BLOCKED', 'good');
    }
}, true);

document.addEventListener('contextmenu', function() {
    addLog('🖱️ Right-click → ⛔ BLOCKED', 'good');
}, true);
</script>
